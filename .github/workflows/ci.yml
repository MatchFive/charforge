name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-tools:
    name: 静态检查工具（lint + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 仓库里已没有服务端（`server/` 于 v0.4.5 删除），剩下的 Python 全是 CI 工具脚本，
      # 所以**不装项目本身**（pyproject 也不再声明为包），只装跑这些脚本要用的东西。
      - name: 安装工具
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint
        run: ruff check .

      # 工具自己的规则也得有人看守：一条写歪的规则要么漏报（等于没有）、
      # 要么误报（没人再信它）。tests/ 测的正是这两件事。
      - name: 单测（C# 静态检查器 + 包结构校验器）
        run: pytest -q

  unity-package:
    name: Unity 包结构校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 校验的都是"在 CI 里能查出来、但一旦漏掉就会在用户工程里爆掉"的问题：
      # 脚本漏在 asmdef 之外（会被编进 Assembly-CSharp 与用户脚本冲突）、
      # 程序集引用拼错、类型重名、引用了不存在的 uxml/uss、
      # uxml/uss 路径与 UPM 虚拟路径（Packages/<package.json 的 name>/）不一致
      # —— 这一项在 Unity 里是**静默失败**（界面回落而不报错），必须靠 CI 拦、
      # asmdef 硬引用与 package.json 依赖不一致。
      - name: 校验包结构（asmdef / 脚本归属 / 引用 / 资产路径）
        run: python scripts/validate_unity_package.py

      # C# 侧唯一能在 CI 里跑起来的验证：没有 Unity 就没法真正编译，
      # 但"语法合法、Unity API 用错"这一类错误（不存在的枚举成员、错误的参数类型、
      # 在 .NET Framework 档位下不存在的重载、Object 二义）可以静态拦下来。
      # 这三轮真机编译暴露的问题几乎都属于这一类。
      - name: 检查 Unity API 误用
        run: python scripts/check_unity_api_misuse.py

  schema:
    name: JSON Schema 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - name: 校验示例配置符合 schema
        run: python scripts/validate_examples.py
