[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charforge"
version = "0.1.0"
description = "Unity 2D character asset pipeline: prompt + style reference -> walkable, talkable NPC prefab"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["unity", "2d", "game-dev", "stable-diffusion", "controlnet", "agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Graphics",
]

dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pillow>=10.3",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "websockets>=12.0",
]

[project.optional-dependencies]
# 本地生成链路（需要 GPU；CPU 也能跑但慢）
local = [
  "torch>=2.2",
  "diffusers>=0.30",
  "transformers>=4.42",
  "accelerate>=0.31",
  "controlnet-aux>=0.0.7",
  "rembg>=2.0.50",
  "onnxruntime>=1.18",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.23",
]
# 云端生成链路（无 GPU 也能出图，需自带 API key）
cloud = [
  "openai>=1.30",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
charforge = "server.cli:main"

[tool.setuptools.packages.find]
include = ["server*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
