# 本文件只承载**工具配置**（ruff / pytest），不再是一个可安装的 Python 包。
#
# 仓库里的 Python 分两块：
#   scripts/ + tests/                「CI 用的静态检查工具」（本文件管它们）
#   agent/                           npcforge Agent——独立可安装包，自己的 pyproject.toml
#
#   scripts/check_unity_api_misuse.py     C# 语法与 Unity API 误用（10 条规则）
#   scripts/validate_unity_package.py     asmdef 归属 / 引用 / 资产与 .meta
#   scripts/validate_examples.py          examples/*/character.yaml ↔ schemas/
#   scripts/check_prompt_parts.py         立绘固定件三处对齐（C# ←→ bindings ←→ 工作流）
#
# 原服务端实现 `server/`（FastAPI + pydantic 的装配指令生成器）已于 v0.4.5 整体删除，
# 连同它那一串只在服务端用到的依赖（fastapi / uvicorn / pydantic / pillow / numpy …）
# 和 `charforge` CLI 入口一并移除。要找回那套实现，从 git 历史取：
#   git log --oneline -- server/ | head

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
