[project]
name = "npcforge"
version = "0.1.0"
description = "CharForge 的自主 NPC 创作 Agent：一句话角色描述或一份角色列表，跑出一批可直接拖进 Unity 场景的 2D NPC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic-ai>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
npcforge = "npcforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["npcforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# 与仓库根 pyproject.toml 同一套：agent/ 是独立可安装的包，但 lint 口径不该有第二套。
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

